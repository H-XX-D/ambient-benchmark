    - region [ref=e147]:
      - generic [ref=e148]:
        - generic [ref=e149]: Run AMBIENT
        - generic [ref=e150]:
          - heading "Bring the model. Choose the memory." [level=2] [ref=e151]
          - paragraph [ref=e152]: The hosted runner lets each participant choose one reader and a separate judge through Hugging Face Inference Providers. Participants sign in with Hugging Face and authorize only inference access; the harness holds the reader fixed, changes the memory condition, and measures whether retrieved evidence lets that same reader complete questions it missed without memory.
          - paragraph [ref=e153]: Run scopes contain 10, 100, 200, or 400 unique questions sampled evenly across all ten BEAM abilities. Ten is explicitly a smoke test; the complete 400-question scope is the first hosted option near a ±5-point worst-case single-tier margin. Repeats never count as new questions.
          - paragraph [ref=e154]: "The primary result is attributed memory lift: T4 memory-on completion minus T1 no-memory completion. The report also separates gullible answers, answers without traced support, and cases where the needed evidence was not served. This is not a model leaderboard."
          - paragraph [ref=e155]: Hosted runs produce an unreviewed evidence bundle. A complete 400-question run is automatically recorded on the separate hosted-results board after structural checks; only repository-reviewed bundles enter the verified architecture leaderboard. The GitHub repository remains the canonical protocol, full local runner, and evidence-review path.
          - generic [ref=e156]:
            - link "Evaluation rules" [ref=e157] [cursor=pointer]:
              - /url: https://github.com/H-XX-D/ambient-benchmark/blob/master/RULES.md
            - link "Submission format" [ref=e158] [cursor=pointer]:
              - /url: https://github.com/H-XX-D/ambient-benchmark/blob/master/submissions/README.md
