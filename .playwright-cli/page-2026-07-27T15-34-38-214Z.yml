    - generic [ref=e78]:
      - generic [ref=e79]:
        - generic [ref=e80]: "01"
        - paragraph [ref=e81]: Measure inventory
      - generic [ref=e82]:
        - heading "Fifteen reported abilities" [level=2] [ref=e83]
        - paragraph [ref=e84]: These abilities describe the behaviors a dependable memory system should make possible, from declining unsupported answers to preserving provenance, chronology, and set integrity. AMBIENT tests the observable result of each ability—not the internal mechanism a system uses to produce it.
        - generic [ref=e85]:
          - article [ref=e86]:
            - generic [ref=e87]: "01"
            - heading "Abstention" [level=3] [ref=e88]
            - paragraph [ref=e89]: Declines when the record cannot support an answer instead of inventing one.
          - article [ref=e90]:
            - generic [ref=e91]: "02"
            - heading "Adoption" [level=3] [ref=e92]
            - paragraph [ref=e93]: Routes new memories into the governed store so they remain available later.
          - article [ref=e94]:
            - generic [ref=e95]: "03"
            - heading "Anteriority" [level=3] [ref=e96]
            - paragraph [ref=e97]: Establishes that one record existed before another without inventing time evidence.
          - article [ref=e98]:
            - generic [ref=e99]: "04"
            - heading "Calibration" [level=3] [ref=e100]
            - paragraph [ref=e101]: Keeps confidence proportional to evidence and resists confidence laundering.
          - article [ref=e102]:
            - generic [ref=e103]: "05"
            - heading "Concurrency" [level=3] [ref=e104]
            - paragraph [ref=e105]: Preserves simultaneous writes without silent loss, corruption, or cross-talk.
          - article [ref=e106]:
            - generic [ref=e107]: "06"
            - heading "Contradiction resolution" [level=3] [ref=e108]
            - paragraph [ref=e109]: Surfaces incompatible claims instead of choosing a convenient side as fact.
          - article [ref=e110]:
            - generic [ref=e111]: "07"
            - heading "Enumeration" [level=3] [ref=e112]
            - paragraph [ref=e113]: Returns the complete requested set without omissions, duplicates, or unrelated members.
          - article [ref=e114]:
            - generic [ref=e115]: "08"
            - heading "Expiry" [level=3] [ref=e116]
            - paragraph [ref=e117]: Stops treating a claim as current after its declared or semantic validity ends.
          - article [ref=e118]:
            - generic [ref=e119]: "09"
            - heading "Federation" [level=3] [ref=e120]
            - paragraph [ref=e121]: Combines independent stores while preserving origin and exposing cross-store conflicts.
          - article [ref=e122]:
            - generic [ref=e123]: "10"
            - heading "Holonomy" [level=3] [ref=e124]
            - paragraph [ref=e125]: Detects cyclic ordering contradictions such as A before B before C before A.
          - article [ref=e126]:
            - generic [ref=e127]: "11"
            - heading "Modality" [level=3] [ref=e128]
            - paragraph [ref=e129]: Keeps hypothetical, proposed, and actual events from being mistaken for one another.
          - article [ref=e130]:
            - generic [ref=e131]: "12"
            - heading "Provenance" [level=3] [ref=e132]
            - paragraph [ref=e133]: Preserves where a remembered claim came from and which evidence supports it.
          - article [ref=e134]:
            - generic [ref=e135]: "13"
            - heading "Reactivity" [level=3] [ref=e136]
            - paragraph [ref=e137]: Updates dependent conclusions when supporting memory changes or is superseded.
          - article [ref=e138]:
            - generic [ref=e139]: "14"
            - heading "Reader independence" [level=3] [ref=e140]
            - paragraph [ref=e141]: Shows the memory supplies facts the fixed reader could not recover alone.
          - article [ref=e142]:
            - generic [ref=e143]: "15"
            - heading "Set integrity" [level=3] [ref=e144]
            - paragraph [ref=e145]: Proves served items belong to the recorded set and that its history is append-only.
