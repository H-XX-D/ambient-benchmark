      - generic [ref=e222]:
        - heading "Bring the model. Choose the memory." [level=2] [ref=e223]
        - paragraph [ref=e224]: The hosted runner asks for a reader model, a memory adapter, and a separate judge. Your scoped API keys pay those model providers for the run. The harness holds the reader fixed, changes the memory condition, and measures whether retrieved evidence lets that same reader complete questions it missed without memory.
        - paragraph [ref=e225]: Run scopes contain 10, 100, 200, or 400 unique questions sampled evenly across all ten BEAM abilities. Ten is explicitly a smoke test; the complete 400-question scope is the first hosted option near a ±5-point worst-case single-tier margin. Repeats never count as new questions.
        - paragraph [ref=e226]: "The primary result is attributed memory lift: T4 memory-on completion minus T1 no-memory completion. The report also separates gullible answers, answers without traced support, and cases where the needed evidence was not served. This is not a model leaderboard."
        - paragraph [ref=e227]: Hosted runs produce an unreviewed evidence bundle and never publish themselves. The GitHub repository remains the canonical protocol, full local runner, review path, and source of every leaderboard submission.
